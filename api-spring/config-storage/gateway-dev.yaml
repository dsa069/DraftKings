server:
  port: ${PORT:8080}            

eureka:
  instance:
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      default-zone: https://dk-spring-eureka-dev.cnsa-2026-dsa069.tech/eureka/

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  application:
    name: ${spring.application.name}
    description: This is the API Gateway that centralizes access to all microservices en desarrollo
    version: '@project.version@'