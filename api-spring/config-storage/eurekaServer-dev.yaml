server:
 port: ${PORT:8080}
eureka:
 client:
  register-with-eureka: false
  fetch-registry: false

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
info:
  application:
    name: ${spring.application.name}
    description: Eureka server en desarrollo
    version: '@project.version@'