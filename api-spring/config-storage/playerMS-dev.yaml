server:
  port: ${PORT:${SERVER_PORT:0}}
eureka:
  instance:
    hostname: dk-spring-eureka-dev.cnsa-2026-dsa069.tech
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      default-zone: http://dk-spring-eureka-dev.cnsa-2026-dsa069.tech:8080

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
info:
  application:
    name: ${spring.application.name}
    description: Player microservice en desarrollo
    version: '@project.version@'
