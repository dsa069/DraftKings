server:
 port: 8761
eureka:
 server:
  enable-self-preservation: true
 client:
  register-with-eureka: false
  fetch-registry: false

  management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
info:
  application:
    name: ${spring.application.name}
    description: Eureka server en produccion
    version: '@project.version@'