server:
  port: 8080             

eureka:
  instance:
    hostname: dk-spring.cnsa-2026-dsa069.tech:443
    prefer-ip-address: false 
    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443

    status-page-url: https://${eureka.instance.hostname}/actuator/info
    health-check-url: https://${eureka.instance.hostname}/actuator/health
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      defaultZone: http://dk-spring-eureka.cnsa-2026-dsa069.tech/eureka/

app:
  cors:
    allowed-origins:
      - "https://draftkings.cnsa-2026-dsa069.tech"

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

info:
  application:
    name: ${spring.application.name}
    description: This is the API Gateway that centralizes access to all microservices en produccion
    version: '@project.version@'