server:
  port: 8080             

eureka:
  instance:
  # Rutas microservicios: http://localhost:8080/<microservice-name>/actuator/info
    instance-id: ${eureka.instance.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    service-url:
      default-zone: http://localhost:8761

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,refresh

info:
  application:
    name: ${spring.application.name}
    description: This is the API Gateway that centralizes access to all microservices usando config server
    version: '@project.version@'