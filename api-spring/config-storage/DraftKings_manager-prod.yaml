server:
  port: ${PORT:${SERVER_PORT:0}}
eureka:
  client:
    service-url:
      default-zone: http://localhost:8761
  instance:
    hostname: localhost

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
info:
  application:
    name: ${spring.application.name}
    description: DraftKings manager microservice en produccion
    version: '@project.version@'