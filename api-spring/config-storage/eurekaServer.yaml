server:
 port: 8761
eureka:
 server:
  # True en production, false en desarrollo para evitar problemas de auto-preservación
  enable-self-preservation: false
 client:
  register-with-eureka: false
  fetch-registry: false

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,refresh
info:
  application:
    name: ${spring.application.name}
    description: Eureka server usando config server
    version: '@project.version@'