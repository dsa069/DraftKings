<app-header-submenu title="Add Player"></app-header-submenu>
<ion-content class="custom-content">
  <ion-grid class="form-section ion-no-padding">
    <ion-row>
      <ion-col class="ion-no-padding">
        <ion-label class="custom-label">Display Name</ion-label>
        <ion-input
          class="custom-input"
          placeholder="e.g. Mbappé"
          type="text"
          fill="outline"
        ></ion-input>
      </ion-col>
    </ion-row>

    <ion-row class="gap-gutter">
      <ion-col class="ion-no-padding col-50">
        <ion-label class="custom-label">First Name</ion-label>
        <ion-input
          class="custom-input"
          placeholder="e.g. Kylian"
          type="text"
          fill="outline"
        ></ion-input>
      </ion-col>
      <ion-col class="ion-no-padding col-50">
        <ion-label class="custom-label">Last Name</ion-label>
        <ion-input
          class="custom-input"
          placeholder="e.g. Mbappé"
          type="text"
          fill="outline"
        ></ion-input>
      </ion-col>
    </ion-row>

    <ion-row class="gap-gutter">
      <ion-col class="ion-no-padding col-33">
        <ion-label class="custom-label">Age</ion-label>
        <ion-input
          class="custom-input"
          placeholder="25"
          type="number"
          fill="outline"
        ></ion-input>
      </ion-col>
      <ion-col class="ion-no-padding col-flex">
        <ion-label class="custom-label">Birthdate</ion-label>
        <ion-input class="custom-input" type="date" fill="outline"></ion-input>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col class="ion-no-padding">
        <ion-label class="custom-label">Nationality</ion-label>
        <ion-input
          class="custom-input"
          placeholder="e.g. France"
          type="text"
          fill="outline"
        ></ion-input>
      </ion-col>
    </ion-row>

    <ion-row class="gap-gutter">
      <ion-col class="ion-no-padding col-50">
        <ion-label class="custom-label">Height (cm)</ion-label>
        <ion-input
          class="custom-input"
          placeholder="178"
          type="number"
          fill="outline"
        ></ion-input>
      </ion-col>
      <ion-col class="ion-no-padding col-50">
        <ion-label class="custom-label">Weight (kg)</ion-label>
        <ion-input
          class="custom-input"
          placeholder="73"
          type="number"
          fill="outline"
        ></ion-input>
      </ion-col>
    </ion-row>

    <ion-row class="gap-gutter">
      <ion-col class="ion-no-padding col-50">
        <ion-label class="custom-label">Team</ion-label>
        <ion-input
          class="custom-input"
          placeholder="e.g. PSG"
          type="text"
          fill="outline"
        ></ion-input>
      </ion-col>
      <ion-col class="ion-no-padding col-50">
        <ion-label class="custom-label">League</ion-label>
        <ion-input
          class="custom-input"
          placeholder="e.g. Ligue 1"
          type="text"
          fill="outline"
        ></ion-input>
      </ion-col>
    </ion-row>

    <ion-row class="gap-gutter">
      <ion-col class="ion-no-padding col-flex">
        <ion-label class="custom-label">Position</ion-label>
        <ion-select
          class="custom-input custom-select"
          placeholder="Select Position"
          interface="popover"
          fill="outline"
        >
          <ion-select-option value="fw">Forward</ion-select-option>
          <ion-select-option value="mf">Midfielder</ion-select-option>
          <ion-select-option value="df">Defender</ion-select-option>
          <ion-select-option value="gk">Goalkeeper</ion-select-option>
        </ion-select>
      </ion-col>
      <ion-col class="ion-no-padding col-33">
        <ion-label class="custom-label">Number</ion-label>
        <ion-input
          class="custom-input text-center text-stat"
          placeholder="10"
          type="number"
          fill="outline"
        ></ion-input>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid class="media-section ion-no-padding">
    <ion-row>
      <ion-col class="ion-no-padding">
        <ion-text class="section-title">Player Photo</ion-text>
        <ion-item class="photo-item" lines="none">
          <ion-avatar class="photo-avatar" slot="start">
            <ion-icon name="person"></ion-icon>
          </ion-avatar>
          <ion-button class="photo-btn" fill="clear" slot="start">
            <ion-icon name="camera" slot="start"></ion-icon>
            Take Photo
          </ion-button>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-grid class="map-section ion-no-padding">
    <ion-row>
      <ion-col class="ion-no-padding">
        <ion-text class="section-title">Hometown / Origin</ion-text>
        <ion-card class="map-card ion-no-margin">
          <ion-img
            class="map-bg"
            src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&q=80&w=800"
          ></ion-img>
          <ion-icon class="map-pin" name="location"></ion-icon>
          <ion-card-content class="map-footer">
            <ion-text class="map-text">Tap to set location</ion-text>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer class="ion-no-border bottom-action-footer">
  <ion-toolbar class="transparent-toolbar">
    <ion-button expand="block" class="save-btn" (click)="onSavePlayer()">
      <ion-icon slot="start" name="save-outline"></ion-icon>
      Save Player
    </ion-button>
  </ion-toolbar>
</ion-footer>
