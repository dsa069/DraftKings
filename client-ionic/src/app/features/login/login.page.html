<ion-content class="login-container">
  <div class="login-wrapper">
    <header class="login-header">
      <h1 class="login-title">DRAFTKINGS</h1>
      <p class="login-subtitle">Enter the arena. Manage your squad.</p>
    </header>

    <ion-card class="login-card">
      <ion-card-content class="login-form-wrapper">
        <form (ngSubmit)="onLogin()" [formGroup]="loginForm">
          <!-- Email Input -->
          <div class="form-group">
            <ion-label class="form-label">Email Address</ion-label>
            <ion-item class="form-item" lines="none">
              <ion-icon slot="start" name="mail-outline"></ion-icon>
              <ion-input
                formControlName="email"
                type="email"
                placeholder="coach@example.com"
                class="form-input"
              ></ion-input>
            </ion-item>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <div class="form-label-row">
              <ion-label class="form-label">Password</ion-label>
              <a class="forgot-link">Forgot?</a>
            </div>
            <ion-item class="form-item" lines="none">
              <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
              <ion-input
                #passwordInput
                formControlName="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="••••••••"
                class="form-input"
              ></ion-input>
              <ion-button
                slot="end"
                fill="clear"
                (click)="togglePasswordVisibility()"
                class="password-toggle"
              >
                <ion-icon
                  [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
                ></ion-icon>
              </ion-button>
            </ion-item>
          </div>

          <!-- Submit Button -->
          <ion-button type="submit" expand="block" class="login-button">
            Login
            <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>

    <!-- Sign Up Link -->
    <div class="signup-section">
      <p class="signup-text">
        New to the game?
        <a class="signup-link">Create an account</a>
      </p>
    </div>
  </div>
</ion-content>
