<ion-content class="login-container">
  <div class="login-wrapper">
    <header class="login-header">
      <h1 class="login-title">DRAFTKINGS</h1>
      <p class="login-subtitle">Enter the arena. Manage your squad.</p>
    </header>

    <app-login-card
      footerText="New to the game?"
      footerActionText="Create an account"
      [isNodeSelected]="isNodeSelected"
      [submitText]="'Login'"
      [formId]="'loginFormId'"
      (footerActionClick)="gotoSignUp()"
      (backendChange)="isNodeSelected = $event"
    >
      <form (ngSubmit)="onLogin()" [formGroup]="loginForm" id="loginFormId">
        <div class="form-group">
          <ion-label class="form-label">Email Address</ion-label>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="mail-outline"></ion-icon>
            <ion-input
              formControlName="email"
              type="email"
              placeholder="coach@example.com"
              class="form-input"
            ></ion-input>
          </ion-item>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <ion-label class="form-label">Password</ion-label>
            <ion-button fill="clear" class="forgot-link" (click)="gotoSignUp()"
              >Forgot?</ion-button
            >
          </div>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input
              #passwordInput
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              class="form-input"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              (click)="togglePasswordVisibility()"
              class="password-toggle"
            >
              <ion-icon
                [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
              ></ion-icon>
            </ion-button>
          </ion-item>
        </div>
      </form>
    </app-login-card>
  </div>
</ion-content>
