<ion-content class="sign-up-page">
  <div class="hero-container">
    <div
      class="hero-image"
      style="background-image: var(--header-bg-image)"
    ></div>

    <div class="hero-gradient-vertical"></div>
    <div class="hero-gradient-horizontal"></div>

    <div class="back-button-container">
      <ion-back-button
        defaultHref="/"
        class="circular-back-btn"
      ></ion-back-button>
    </div>
  </div>

  <main class="registration-main">
    <div class="branding-header">
      <div class="badge-draft">
        <ion-icon name="game-controller-outline" class="badge-icon"></ion-icon>
        <span class="badge-text">New Player Draft</span>
      </div>

      <h1 class="hero-title">
        Build Your<br />
        <span class="hero-title-highlight">Squad</span>
      </h1>

      <p class="hero-description">
        Create your DraftKings account to manage rosters, track stats, and
        dominate the league.
      </p>
    </div>
    <!-- Registration Card -->
    <app-login-card
      footerText="Already on the roster?"
      footerActionText="Log In"
      [isNodeSelected]="isNodeSelected"
      [submitText]="'Enter the Draft'"
      [formId]="'signUpFormId'"
      (footerActionClick)="gotoLogin()"
      (backendChange)="isNodeSelected = $event"
    >
      <form
        [formGroup]="signUpForm"
        (ngSubmit)="onRegister()"
        id="signUpFormId"
      >
        <!-- Full Name Field -->
        <div class="form-group">
          <ion-label class="form-label">Full Name</ion-label>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-input
              formControlName="fullName"
              type="text"
              placeholder="Enter your coach name"
              class="form-input"
            ></ion-input>
          </ion-item>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <ion-label class="form-label">Email Address</ion-label>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="mail-outline"></ion-icon>
            <ion-input
              formControlName="email"
              type="email"
              placeholder="coach@example.com"
              class="form-input"
            ></ion-input>
          </ion-item>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="form-label-row">
            <ion-label class="form-label">Secure Password</ion-label>
          </div>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input
              #passwordInput
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              class="form-input"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              (click)="togglePasswordVisibility()"
              class="password-toggle"
            >
              <ion-icon
                [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
              ></ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <!-- Password Requirements -->
        <div class="password-requirements-container">
          <div class="requirement-item">
            <div class="requirement-dot"></div>
            <span class="requirement-text">8+ CHARACTERS</span>
          </div>
          <div class="requirement-item">
            <div class="requirement-dot"></div>
            <span class="requirement-text">1 NUMBER</span>
          </div>
          <div class="requirement-item">
            <div class="requirement-dot"></div>
            <span class="requirement-text">1 SYMBOL</span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <div class="form-label-row">
            <ion-label class="form-label">Repeat Password</ion-label>
          </div>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input
              #passwordInput
              formControlName="confirmPassword"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              class="form-input"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              (click)="togglePasswordVisibility()"
              class="password-toggle"
            >
              <ion-icon
                [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
              ></ion-icon>
            </ion-button>
          </ion-item>
        </div>
      </form>
    </app-login-card>
  </main>
</ion-content>
