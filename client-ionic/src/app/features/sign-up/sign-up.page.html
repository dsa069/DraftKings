<ion-content class="sign-up-container">
  <!-- Hero Header Section -->
  <div class="sign-up-header">
    <div
      class="header-background"
      data-alt="A dramatic, high-contrast, low-light photograph of a professional sports stadium at night. The floodlights cast intense beams through a slight mist, illuminating the vibrant green turf of the pitch. Deep shadows create a moody, high-stakes, competitive atmosphere, aligning with a modern sports technology aesthetic. The color palette relies heavily on deep, pitch blacks, stadium greys, and striking accents of neon turf green."
    ></div>

    <!-- Gradient overlays for seamless blend -->
    <div class="header-gradient-top"></div>
    <div class="header-gradient-side"></div>

    <!-- Back Button -->
    <div class="header-back-button">
      <ion-back-button class="back-btn" defaultHref="/"></ion-back-button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="sign-up-wrapper">
    <!-- Branding Section -->
    <div class="branding-section">
      <div class="draft-badge">
        <ion-icon name="game-controller"></ion-icon>
        <span class="badge-text">New Player Draft</span>
      </div>

      <h1 class="sign-up-title">
        Build Your<br />
        <span class="highlight-text">Squad</span>
      </h1>

      <p class="sign-up-subtitle">
        Create your DraftKings account to manage rosters, track stats, and
        dominate the league.
      </p>
    </div>

    <!-- Registration Card -->
    <app-login-card
      footerText="Already on the roster?"
      footerActionText="Log In"
      (footerActionClick)="gotoLogin()"
    >
      <form (ngSubmit)="onRegister()" [formGroup]="signUpForm">
        <!-- Full Name Field -->
        <div class="form-group">
          <ion-label class="form-label">Full Name</ion-label>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-input
              formControlName="fullName"
              type="text"
              placeholder="Enter your coach name"
              class="form-input"
            ></ion-input>
          </ion-item>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <ion-label class="form-label">Email Address</ion-label>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="mail-outline"></ion-icon>
            <ion-input
              formControlName="email"
              type="email"
              placeholder="coach@example.com"
              class="form-input"
            ></ion-input>
          </ion-item>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="form-label-row">
            <ion-label class="form-label">Secure Password</ion-label>
          </div>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input
              #passwordInput
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              class="form-input"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              (click)="togglePasswordVisibility()"
              class="password-toggle"
            >
              <ion-icon
                [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
              ></ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <!-- Password Requirements -->
        <div class="password-requirements-container">
          <div class="requirement-item">
            <div class="requirement-dot"></div>
            <span class="requirement-text">8+ CHARACTERS</span>
          </div>
          <div class="requirement-item">
            <div class="requirement-dot"></div>
            <span class="requirement-text">1 NUMBER</span>
          </div>
          <div class="requirement-item">
            <div class="requirement-dot"></div>
            <span class="requirement-text">1 SYMBOL</span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <div class="form-label-row">
            <ion-label class="form-label">Repeat Password</ion-label>
          </div>
          <ion-item class="form-item" lines="none">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input
              #passwordInput
              formControlName="confirmPassword"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              class="form-input"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              (click)="togglePasswordVisibility()"
              class="password-toggle"
            >
              <ion-icon
                [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
              ></ion-icon>
            </ion-button>
          </ion-item>
        </div>
        <ion-button type="submit" expand="block" class="login-button">
          Enter the Draft
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
      </form>
    </app-login-card>
  </div>
</ion-content>
