          <ion-icon
            slot="start"
            name="search-outline"
            class="search-icon"

            placeholder="Search players..."
            type="text"
            class="search-input"
          ></ion-input>
        </ion-item>
      </ion-col>

      <ion-col class="filter-col" size="auto">
        <ion-button class="filter-button" fill="clear">

        </ion-button>
      </ion-col>
    </ion-row>
