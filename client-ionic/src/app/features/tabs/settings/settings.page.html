<app-header></app-header>

<ion-content [fullscreen]="true">
  <div class="ion-padding">
    @if (userProfile(); as user) {
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ user.userName }}</ion-card-title>
        <ion-badge color="primary">{{ user.role }}</ion-badge>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="full">
          <ion-item>
            <ion-label>
              <p>Correo Electrónico</p>
              <h3>{{ user.email }}</h3>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
    } @else {
    <div class="ion-text-center" style="margin-top: 50px">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Obteniendo datos de PostgreSQL...</p>
    </div>
    }
  </div>
</ion-content>
