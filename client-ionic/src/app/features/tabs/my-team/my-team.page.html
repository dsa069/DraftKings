      <ion-col class="title-col">
        <ion-text class="headline">Starting XI</ion-text>
        <ion-text class="subtitle">
          <ion-icon name="git-network-outline"></ion-icon> Tactical Setup
        </ion-text>
      </ion-col>

      <ion-col size="auto" class="ovr-col">
        <ion-chip class="ovr-chip">
          <ion-label class="ovr-number">88</ion-label>
          <ion-label class="ovr-text">OVR</ion-label>
        </ion-chip>
      </ion-col>
    </ion-row>

    <ion-row class="filters-row">
