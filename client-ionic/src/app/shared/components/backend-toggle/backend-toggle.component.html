<ion-grid class="ion-no-padding selector-grid">
  <ion-row>
    <ion-col size="6" class="ion-padding-end">
      <ion-button
        fill="none"
        class="option-button"
        [class.active]="selectedBackend === 'node'"
        (click)="select('node')"
      >
        <ion-label class="button-content">
          <ion-icon name="logo-nodejs" class="option-icon"></ion-icon>
          <ion-text class="option-title">Node.js</ion-text>
          <ion-text class="option-description">Fast JS Runtime</ion-text>
        </ion-label>
      </ion-button>
    </ion-col>

    <ion-col size="6" class="ion-padding-start">
      <ion-button
        fill="none"
        class="option-button"
        [class.active]="selectedBackend === 'springboot'"
        (click)="select('springboot')"
      >
        <ion-label class="button-content">
          <ion-icon name="leaf-outline" class="option-icon"></ion-icon>
          <ion-text class="option-title">Spring Boot</ion-text>
          <ion-text class="option-description">Robust Java API</ion-text>
        </ion-label>
      </ion-button>
    </ion-col>
  </ion-row>
</ion-grid>
