<ion-header [translucent]="false" class="app-header">
  <ion-toolbar color="surface">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>

    <ion-title class="app-subtitle">Add Player</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="goToHome()">
        <ion-img
          class="logo"
          src="assets/icon/DK-logo.png"
          alt="DraftKings Logo"
        ></ion-img>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
