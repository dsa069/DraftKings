<ion-header [translucent]="false" class="header-container">
  <ion-toolbar color="surface">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goToHome()">
        <ion-img
          class="header-logo"
          src="assets/icon/DK-logo.png"
          alt="DraftKings Logo"
        ></ion-img>
      </ion-button>
    </ion-buttons>

    <ion-title class="header-title-base app-subtitle">{{ title }}</ion-title>

    <ion-buttons slot="end">
      <ion-back-button
        [defaultHref]="href"
        icon="chevron-back-circle-outline"
        class="header-nav-button"
      ></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
