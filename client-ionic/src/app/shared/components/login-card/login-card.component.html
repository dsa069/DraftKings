<ion-card class="login-card">
  <ion-card-content class="login-form-wrapper">
    <ng-content></ng-content>

    <ion-button
      type="submit"
      [attr.form]="formId"
      expand="block"
      class="login-button"
    >
      {{ submitText }}
      <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
    </ion-button>
  </ion-card-content>
</ion-card>

<ion-footer class="signup-section ion-no-border">
  <ion-text class="signup-text ion-no-margin">
    {{ footerText }}
    <ion-button fill="clear" class="signup-link" (click)="onFooterAction()">
      {{ footerActionText }}
    </ion-button>
  </ion-text>
</ion-footer>
