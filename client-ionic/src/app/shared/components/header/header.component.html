<ion-header [translucent]="false" class="header-container app-header">
  <ion-toolbar color="surface">
    <ion-buttons slot="start">
      <ion-button
        class="header-nav-button icon-button"
        fill="clear"
        (click)="goToHome()"
      >
        <ion-img
          class="header-logo"
          src="assets/icon/DK-logo.png"
          alt="DraftKings Logo"
        ></ion-img>
      </ion-button>
    </ion-buttons>

    <ion-title class="header-title-base app-title">DRAFTKINGS</ion-title>

    <ion-buttons slot="end">
      @if (isLogged()) {
      <ion-button
        (click)="closeSession()"
        aria-label="Log Out"
        class="header-nav-button icon-button"
        fill="clear"
      >
        <ion-icon
          slot="icon-only"
          name="log-out-outline"
          class="icon"
        ></ion-icon>
      </ion-button>
      } @else {
      <ion-button
        (click)="goToLogin()"
        aria-label="Log In"
        class="header-nav-button icon-button"
        fill="clear"
      >
        <ion-icon
          slot="icon-only"
          name="log-in-outline"
          class="icon"
        ></ion-icon>
      </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>
