name: CI Node

on:
  workflow_call:

jobs:
  # Job principal de construcción
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./api-node
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api-node/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Artifacts (Build)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: |
            api-node/dist/
            api-node/public/
            api-node/dashboard_server/views/

  # Job separado para Tests para que aparezca el cuadradito
  test-and-reports:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./api-node
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Test
        uses: mattallty/jest-github-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          test-command: "npm run coverage"
          working-directory: "api-node"

      - name: Test Report
        uses: dorny/test-reporter@v3.0.0
        if: always()
        with:
          name: JEST Tests
          path: "api-node/junit.xml"
          reporter: jest-junit

  # Job separado para Linting
  lint:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
    defaults:
      run:
        working-directory: ./api-node
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
      - run: npm install

      - name: Save Code Linting Report JSON
        run: npm run lint:json
        continue-on-error: true

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@v4
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: "./api-node/coverage/eslint-result.json"
