name: CI/CD Node

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./api-node

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api-node/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Artifacts (Build)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: |
            api-node/dist/
            api-node/public/
            api-node/dashboard_server/views/

      - name: Save Code Linting Report JSON
        run: npm run lint:json
        continue-on-error: true

      - name: Test
        uses: mattallty/jest-github-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          test-command: "npm run coverage"
          working-directory: "api-node"

      - name: Upload Test Results and Coverage
        if: success() || failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: |
            ./api-node/junit.xml
            ./api-node/coverage/

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@v4
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: "./api-node/coverage/eslint-result.json"

      - name: Test Report
        uses: dorny/test-reporter@v3.0.0
        with:
          artifact: test-results
          name: JEST Tests
          path: "junit.xml"
          reporter: jest-junit

  deploy:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./api-node
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: api-node/dist/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build Docker image
        run: |
          docker build -t us-east1-docker.pkg.dev/cnsa-2026/draftkings/api-node:latest .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push us-east1-docker.pkg.dev/cnsa-2026/draftkings/api-node:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: "dk-node-dev"
          region: "us-east1"
          image: "us-east1-docker.pkg.dev/cnsa-2026/draftkings/api-node:latest"
          secrets: |
            /app/enviroments/env=${{ secrets.NODE_ENV_DEV }}:latest
