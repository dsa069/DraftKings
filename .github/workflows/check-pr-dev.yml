name: Check Dev Source Branch
on:
  pull_request:
    branches:
      - dev  # Se activa solo cuando el destino es 'dev'

jobs:
  dev-branch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch name
        run: |
          # Obtenemos el nombre de la rama que quiere entrar (source)
          SOURCE_BRANCH="${{ github.head_ref }}"
          
          # Definimos las únicas ramas permitidas (coincidencia exacta)
          if [[ "$SOURCE_BRANCH" == "shared" || \
                "$SOURCE_BRANCH" == "ionic" || \
                "$SOURCE_BRANCH" == "node"   || \
                "$SOURCE_BRANCH" == "spring" || \
                "$SOURCE_BRANCH" == "corba" ]]; then
            echo "✅ Rama '$SOURCE_BRANCH' permitida para mergear en dev."
            exit 0
          else
            echo "❌ ERROR: No se permite mergear '$SOURCE_BRANCH' en 'dev'."
            echo "Solo se permiten las ramas: shared, ionic, node, spring, corba."
            exit 1
          fi