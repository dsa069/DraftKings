name: CI/CD Corba

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./corba-services/DK_News_Manager

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      # Set up Java 8 - CRITICAL: CORBA requires Java 8 (removed from Java 11+)
      - name: Set up JDK 8
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      # Verify Java version
      - name: Verify Java Version
        run: java -version

      # Verify idlj compiler is available (part of JDK)
      - name: Verify idlj Compiler
        run: which idlj || echo "idlj is included in JDK, will be invoked by Maven"

      # Build, Compile, and Test in a single Maven command
      # Phases executed in order: generate-sources (idlj) → compile → test
      - name: Build with Maven
        run: mvn -B clean verify

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: corba-jar
          path: corba-services/DK_News_Manager/target/*-jar-with-dependencies.jar
          if-no-files-found: error

      # Upload Test Results (for visibility in PR checks)
      - name: Upload Test Results
        uses: actions/upload-artifact@v7.0.1
        if: success() || failure()
        with:
          name: test-results
          path: corba-services/DK_News_Manager/target/surefire-reports/*.xml

      - name: Add coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: corba-services/DK_News_Manager/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 60
          comment-type: both

      - name: Run Checkstyle Full Report
        uses: dbelyaev/action-checkstyle@v3.10.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: google_checks.xml
          reporter: github-pr-check

      - name: Checkstyle PR Review
        if: github.event_name == 'pull_request'
        uses: dbelyaev/action-checkstyle@v3.10.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review 
          filter_mode: added        
          level: error               

      - name: Publish Test Results
        uses: dorny/test-reporter@v3.0.0
        with:
          artifact: test-results
          name: JUnit Tests
          path: '*.xml'
          reporter: java-junit

      # (Optional) Create a summary of the build
      - name: Build Summary
        if: always()
        run: |
          echo "## CORBA Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: $([ $? -eq 0 ] && echo 'Success' || echo 'Failed')" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version**: $(java -version 2>&1 | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated CORBA Code**: target/generated-sources/corba/BufferApp/" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Report**: target/surefire-reports/" >> $GITHUB_STEP_SUMMARY


  deploy:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./corba-services/DK_News_Manager
    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: corba-jar
          path: corba-services/DK_News_Manager/target

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build Docker image
        run: |
          docker build -t us-east1-docker.pkg.dev/cnsa-2026/draftkings/corba-news-manager:latest .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push us-east1-docker.pkg.dev/cnsa-2026/draftkings/corba-news-manager:latest

      # 1. Instalar la llave ANTES de comprobar la conexión
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2.8.1
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'placeholder'

      # =================================================================
      # INICIO DEL BLOQUE DE RESILIENCIA Y TERRAFORM
      # =================================================================

      # 2. Comprobar si la MV está viva
      - name: Ensure VM is Running
        id: vm_status
        run: |
          STATUS=$(gcloud compute instances describe corba-deploy-vm-tf --zone=us-east1-c --format='get(status)')
          echo "La instancia está en estado: $STATUS"
          
          if [ "$STATUS" = "TERMINATED" ]; then
            echo "Encendiendo la máquina..."
            gcloud compute instances start corba-deploy-vm-tf --zone=us-east1-c
            
            echo "Esperando a que el puerto SSH (22) responda..."
            # Intentar conectar cada 5 segundos hasta que el puerto esté abierto (máximo 2 min)
            for i in {1..24}; do
              if nc -z dk-corba-dev.cnsa-2026-dsa069.tech 22; then
                echo "¡SSH disponible!"
                break
              fi
              echo "Aún no responde... (intento $i)"
              sleep 5
            done
          fi
          
          # Refrescamos el estado para el output
          FINAL_STATUS=$(gcloud compute instances describe corba-deploy-vm-tf --zone=us-east1-c --format='get(status)')
          if [ "$FINAL_STATUS" = "RUNNING" ]; then
            echo "MACHINE_EXISTS=true" >> $GITHUB_OUTPUT
          else
            echo "MACHINE_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      # 3. Configurar Terraform SOLO si la conexión falló
      - name: Setup Terraform
        if: steps.ssh_check.outputs.STATUS == 'down'
        uses: hashicorp/setup-terraform@v4

      # 4. Crear el archivo de credenciales y las llaves SSH SOLO si la conexión falló (Terraform las necesita para crear la MV)
      - name: Create Credentials and SSH Files
        if: steps.ssh_check.outputs.STATUS == 'down'
        working-directory: ./terraform
        run: |
          # 1. Crear el JSON de GCP
          mkdir -p credentials
          echo '${{ secrets.GCP_SA_KEY }}' > ./credentials/gc-dk.json

          # 2. Crear las llaves SSH (Privada y Pública)
          mkdir -p credentials/ssh
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > ./credentials/ssh/id_ed25519
          echo '${{ secrets.SSH_PUBLIC_KEY }}' > ./credentials/ssh/id_ed25519.pub
          
          # 3. Dar permisos correctos a la llave privada (importante para SSH)
          chmod 600 ./credentials/ssh/id_ed25519

      # 5. Lanzar Terraform SOLO si la conexión falló
      - name: Deploy Infrastructure with Terraform
        if: steps.ssh_check.outputs.STATUS == 'down'
        working-directory: ./terraform 
        env:
          # Inyectamos las variables que Terraform está pidiendo
          TF_VAR_gcp_project: "cnsa-2026"
          TF_VAR_dns_managed_zone: "cnsa-2026-dsa069-dns"
        run: |
          terraform init
          terraform apply -auto-approve

      # 6. Esperar a que la MV levante el servicio SSH (Si se ejecutó Terraform)
      - name: Wait for VM and SSH to be ready
        if: steps.ssh_check.outputs.STATUS == 'down'
        env:
          VM_HOST: dk-corba-dev.cnsa-2026-dsa069.tech
          VM_USER: ubuntu
        run: |
          echo "Esperando a que la MV inicie y acepte conexiones SSH..."
          MAX_RETRIES=15
          RETRY_COUNT=0
          
          # Bucle que intenta conectar cada 10 segundos
          until ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no "${VM_USER}@${VM_HOST}" 'echo "SSH Listo"'; do
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "ERROR CRÍTICO: La máquina se creó en Terraform pero no responde por SSH tras varios intentos."
              exit 1
            fi
            echo "Intento $RETRY_COUNT fallido. Esperando 10 segundos..."
            sleep 10
          done
          echo "¡Máquina virtual lista y operativa!"

      # 7. Escanear la huella (Siempre se ejecuta, haya habido Terraform o no)
      - name: Refresh SSH Known Hosts
        run: |
          mkdir -p ~/.ssh
          # Eliminar el archivo si existe para empezar de cero y evitar el error "invalid line"
          rm -f ~/.ssh/known_hosts
          # Escanear la IP/Host de la nueva máquina
          ssh-keyscan -H dk-corba-dev.cnsa-2026-dsa069.tech >> ~/.ssh/known_hosts

      # =================================================================
      # FIN DEL BLOQUE DE RESILIENCIA Y TERRAFORM
      # =================================================================

      # REEMPLAZAR CLOUD RUN POR MV: Cuando un servidor CORBA se registra, genera un "pasaporte" llamado IOR. Este archivo contiene la IP y el puerto exactos donde el servidor está escuchando.
      # En Cloud Run: El servidor está detrás de un Proxy Inverso. El IOR que genera el servidor CORBA suele contener una IP interna de la red de Google (tipo 10.x.x.x). Cuando el cliente recibe ese IOR e intenta conectar a esa IP 10.x.x.x, falla, porque esa IP no existe fuera de Google.
      - name: Deploy to VM
        env:
          VM_HOST: dk-corba-dev.cnsa-2026-dsa069.tech
          VM_USER: ubuntu
          IMAGE: us-east1-docker.pkg.dev/cnsa-2026/draftkings/corba-news-manager:latest
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          ssh "${VM_USER}@${VM_HOST}" 'bash -se' <<EOF
            set -euo pipefail

            # 1. Obtener la IP pública actual
            PUBLIC_IP=\$(curl -s https://api.ipify.org)
            echo "Desplegando en IP: \$PUBLIC_IP"

            # 2. Login y actualización de imagen
            printf '%s' '${GCP_SA_KEY}' | sudo docker login -u _json_key --password-stdin https://us-east1-docker.pkg.dev
            sudo docker pull "${IMAGE}"

            # 3. Limpieza total de contenedores previos
            sudo docker stop corba-news-manager || true
            sudo docker rm corba-news-manager || true

            # 4. Ejecución del contenedor único
            # -p 3000:3000 -> Para el Naming Service
            # -p 8080:8080 -> Para el Servidor (Acceso externo)
            sudo docker run -d --restart unless-stopped \
              --name corba-news-manager \
              -p 3000:3000 \
              -p 8080:8080 \
              -e JAVA_TOOL_OPTIONS="-Dcom.sun.corba.se.ORBServerHost=\$PUBLIC_IP -Dcom.sun.corba.se.ORBServerPort=8080" \
              "${IMAGE}"
            
            # Esperar un poco para que los logs se generen
            sleep 8
          EOF

      - name: Display Combined Logs (ORBD + Server)
        if: always()
        run: |
          echo "### LOGS COMBINADOS (ORBD y Servidor)" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          ssh ubuntu@dk-corba-dev.cnsa-2026-dsa069.tech "sudo docker logs corba-news-manager" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"