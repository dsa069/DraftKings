name: CI/CD Node Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  dist:
    permissions:
      contents: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/node-ci.yml
    secrets: inherit
  deploy:
    runs-on: ubuntu-latest
    needs: dist
    defaults:
      run:
        working-directory: ./api-node
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: api-node/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      # Este paso crea o actualiza el secreto en Google Cloud usando el Secret de GitHub
      - name: Create or Update Secret in GCP
        run: |
          if gcloud secrets describe NODE_ENV_PROD > /dev/null 2>&1; then
            echo "${{ secrets.NODE_ENV_PROD }}" | gcloud secrets versions add NODE_ENV_PROD --data-file=-
          else
            echo "${{ secrets.NODE_ENV_PROD }}" | gcloud secrets create NODE_ENV_PROD --replication-policy="automatic" --data-file=-
          fi

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.prod -t us-east1-docker.pkg.dev/cnsa-2026/draftkings/api-node:0.0.1 .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push us-east1-docker.pkg.dev/cnsa-2026/draftkings/api-node:0.0.1

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: "dk-node"
          region: "us-east1"
          image: "us-east1-docker.pkg.dev/cnsa-2026/draftkings/api-node:0.0.1"
          flags: "--service-account=draftkings@cnsa-2026.iam.gserviceaccount.com --allow-unauthenticated --set-secrets=/app/enviroments/env=NODE_ENV_PROD:latest"
