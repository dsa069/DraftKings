name: CI/CD Ionic Development
# TO DO: Que cloud run coja las variables de entorno de firebase
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ./client-ionic

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client-ionic/package-lock.json

      # Como firebase tiene una versión menor pero funcional con angular 21, usamos --legacy-peer-deps para evitar conflictos de dependencias
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Save Code Linting Report JSON
        run: npm run lint:json
        continue-on-error: true

      - name: Generate Environments
        run: npm run config # <--- ESTO CREA EL ARCHIVO FISICAMENTE
        env:
          FIREBASE_CONFIG_DEV: ${{ secrets.FIREBASE_CONFIG_DEV }}
          SPRING_API_URL_DEV: ${{ secrets.SPRING_API_URL_DEV }}
          NODE_API_URL_DEV: ${{ secrets.NODE_API_URL_DEV }}
          # Aunque este en desarollo y no se vaya a usar env.prod, lo generamos para evitar errores de variables no definidas
          FIREBASE_CONFIG_PROD: ${{ secrets.FIREBASE_CONFIG_DEV }}
          SPRING_API_URL_PROD: ${{ secrets.SPRING_API_URL_DEV }}
          NODE_API_URL_PROD: ${{ secrets.NODE_API_URL_DEV }}

      - name: Build
        run: npx ionic build #En producción, usar --prod

      - name: Upload Artifacts (Build)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: www
          path: client-ionic/www/

      - name: Upload ESLint Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eslint-report
          path: client-ionic/coverage/eslint-result.json

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./client-ionic

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client-ionic/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Environments
        run: npm run config # <--- ESTO CREA EL ARCHIVO FISICAMENTE
        env:
          FIREBASE_CONFIG_DEV: ${{ secrets.FIREBASE_CONFIG_DEV }}
          SPRING_API_URL_DEV: ${{ secrets.SPRING_API_URL_DEV }}
          NODE_API_URL_DEV: ${{ secrets.NODE_API_URL_DEV }}
          FIREBASE_CONFIG_PROD: ${{ secrets.FIREBASE_CONFIG_DEV }}
          SPRING_API_URL_PROD: ${{ secrets.SPRING_API_URL_DEV }}
          NODE_API_URL_PROD: ${{ secrets.NODE_API_URL_DEV }}

      - name: Build web assets
        run: npx ionic build # --prod, en producción

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android Icons and Splash Screens
        run: |
          echo "Generando iconos nativos a partir de las imágenes maestras..."
          npx capacitor-assets generate --android

      - name: Apply Custom Android Configurations
        run: |
          echo "Aplicando recursos y configuraciones personalizadas..."
          # Copia recursiva manteniendo la estructura de directorios
          cp -r android.custom/* android/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          # Rename APK
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/DraftKings-debug.apk

      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/DraftKings-debug.apk"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Android APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: DraftKings-debug-apk
          path: client-ionic/${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error

  tests-components:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./client-ionic
    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client-ionic/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Environments
        run: npm run config # <--- ESTO CREA EL ARCHIVO FISICAMENTE
        env:
          FIREBASE_CONFIG_DEV: ${{ secrets.FIREBASE_CONFIG_DEV }}
          SPRING_API_URL_DEV: ${{ secrets.SPRING_API_URL_DEV }}
          NODE_API_URL_DEV: ${{ secrets.NODE_API_URL_DEV }}
          FIREBASE_CONFIG_PROD: ${{ secrets.FIREBASE_CONFIG_DEV }} # Aunque este en desarollo y no se vaya a usar env.prod, lo generamos para evitar errores de variables no definidas
          SPRING_API_URL_PROD: ${{ secrets.SPRING_API_URL_DEV }}
          NODE_API_URL_PROD: ${{ secrets.NODE_API_URL_DEV }}

      - name: Add Component Header
        run: |
          echo "## 🧩 Cypress: Component Tests - ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY

      - name: Component Tests (Cypress)
        uses: cypress-io/github-action@v7
        with:
          working-directory: client-ionic
          install: false
          component: true
          start: npx ionic serve
          wait-on: "http://localhost:8100"
          browser: ${{ matrix.browser }}

      - name: Upload Cypress Screenshots/Videos
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cypress-component-artifacts-${{ matrix.browser }}
          path: |
            client-ionic/cypress/screenshots
            client-ionic/cypress/videos

  tests-e2e:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ./client-ionic
    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client-ionic/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Environments
        run: npm run config # <--- ESTO CREA EL ARCHIVO FISICAMENTE
        env:
          FIREBASE_CONFIG_DEV: ${{ secrets.FIREBASE_CONFIG_DEV }}
          SPRING_API_URL_DEV: ${{ secrets.SPRING_API_URL_DEV }}
          NODE_API_URL_DEV: ${{ secrets.NODE_API_URL_DEV }}

      - name: Add E2E Header
        run: |
          echo "## 🧪 Cypress: E2E Tests - ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY

      - name: E2E Tests (Cypress)
        uses: cypress-io/github-action@v7
        with:
          working-directory: client-ionic
          install: false
          start: npx ionic serve
          wait-on: "http://localhost:8100"
          browser: ${{ matrix.browser }}

      - name: Upload Cypress Screenshots/Videos
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cypress-e2e-artifacts-${{ matrix.browser }}
          path: |
            client-ionic/cypress/screenshots
            client-ionic/cypress/videos

  lint-report:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: write
    defaults:
      run:
        working-directory: ./client-ionic
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client-ionic/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download Reports
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: "*-report"
          merge-multiple: true

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@v4
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: "eslint-result.json"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - tests-components
      - tests-e2e
      - lint-report
    defaults:
      run:
        working-directory: ./client-ionic
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: www
          path: client-ionic/www

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Create or Update Secrets in GCP
        run: |
          # FIREBASE_CONFIG_DEV
          if gcloud secrets describe FIREBASE_CONFIG_DEV > /dev/null 2>&1; then
            echo "${{ secrets.FIREBASE_CONFIG_DEV }}" | gcloud secrets versions add FIREBASE_CONFIG_DEV --data-file=-
          else
            echo "${{ secrets.FIREBASE_CONFIG_DEV }}" | gcloud secrets create FIREBASE_CONFIG_DEV --replication-policy="automatic" --data-file=-
          fi

          # SPRING_API_URL_DEV
          if gcloud secrets describe SPRING_API_URL_DEV > /dev/null 2>&1; then
            echo "${{ secrets.SPRING_API_URL_DEV }}" | gcloud secrets versions add SPRING_API_URL_DEV --data-file=-
          else
            echo "${{ secrets.SPRING_API_URL_DEV }}" | gcloud secrets create SPRING_API_URL_DEV --replication-policy="automatic" --data-file=-
          fi

          # NODE_API_URL_DEV
          if gcloud secrets describe NODE_API_URL_DEV > /dev/null 2>&1; then
            echo "${{ secrets.NODE_API_URL_DEV }}" | gcloud secrets versions add NODE_API_URL_DEV --data-file=-
          else
            echo "${{ secrets.NODE_API_URL_DEV }}" | gcloud secrets create NODE_API_URL_DEV --replication-policy="automatic" --data-file=-
          fi

      - name: Build Docker image
        run: |
          docker build -t us-east1-docker.pkg.dev/cnsa-2026/draftkings/client-ionic:latest .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push us-east1-docker.pkg.dev/cnsa-2026/draftkings/client-ionic:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: "draftkings-dev" # Nombre del servicio
          region: "us-east1"
          image: "us-east1-docker.pkg.dev/cnsa-2026/draftkings/client-ionic:latest"
          # Temporalmente permitimos acceso público para facilitar pruebas
          flags: "--service-account=draftkings@cnsa-2026.iam.gserviceaccount.com --allow-unauthenticated --ingress=all"
          secrets: |
            FIREBASE_CONFIG_DEV=FIREBASE_CONFIG_DEV:latest
            SPRING_API_URL_DEV=SPRING_API_URL_DEV:latest
            NODE_API_URL_DEV=NODE_API_URL_DEV:latest

          # Si es una web pública, añade esto (producción):
          # flags: '--allow-unauthenticated'

          # Habría que proteger el back desplegado (general)

          # Para ver la pagina en en cloud shell:
          # gcloud run services proxy draftkings-dev --region=us-east1
