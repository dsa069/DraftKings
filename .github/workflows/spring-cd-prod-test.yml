name: CD SpringBoot Production

on:
  workflow_call:
    inputs:
        service_name:
          required: true
          type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-spring/${{ inputs.service_name }}
    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.service_name }}-jar
          path: api-spring/${{ inputs.service_name }}/target

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Docker login to Artifact Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      # TRANSFORMACIÓN: eureka.client.player -> eureka-client-player
      - name: Create Service Slugs
        id: slug
        run: |
          CLEAN_NAME=$(echo "${{ inputs.service_name }}" | sed 's/\./-/g')
          echo "service_slug=$CLEAN_NAME" >> $GITHUB_OUTPUT

      - name: Create or Update Secret in GCP
        if: ${{ inputs.service_name == 'eureka.client.player' }} || ${{ inputs.service_name == 'eureka.client.review' }}
        run: |
          if gcloud secrets describe DB_SQL_PASS_PROD > /dev/null 2>&1; then
            echo "${{ secrets.DB_SQL_PASS_PROD }}" | gcloud secrets versions add DB_SQL_PASS_PROD --data-file=-
          else
            echo "${{ secrets.DB_SQL_PASS_PROD }}" | gcloud secrets create DB_SQL_PASS_PROD --replication-policy="automatic" --data-file=-
          fi

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.prod -t us-east1-docker.pkg.dev/cnsa-2026/draftkings/${{ steps.slug.outputs.service_slug }}:0.0.1 .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push us-east1-docker.pkg.dev/cnsa-2026/draftkings/${{ steps.slug.outputs.service_slug }}:0.0.1

      - name: Set Secret Placeholder
        id: secret
        run: |
          if [[ "${{ inputs.service_name }}" == "eureka.client.player" ]] || [[ "${{ inputs.service_name }}" == "eureka.client.review" ]]; then
            echo "db_secret=DB_SQL_PASS_PROD=DB_SQL_PASS_PROD:latest" >> $GITHUB_OUTPUT
          else
            echo "db_secret=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: "${{ steps.slug.outputs.service_slug }}"
          region: "us-east1"
          image: "us-east1-docker.pkg.dev/cnsa-2026/draftkings/${{ steps.slug.outputs.service_slug }}:0.0.1"
          flags: |
            --allow-unauthenticated
            --ingress=all
          secrets: |
            ${{ steps.secret.outputs.db_secret }}